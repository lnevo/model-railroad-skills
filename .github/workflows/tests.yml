name: tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each suite runs in its own job so the slowest one sets the wall time.
  # schematic-maps, the longest, is split across 3 runners by tests/run_shards.sh;
  # 4 files at once on one runner slowed every file about 3x.
  # operations-pro runs in fast mode: CI has no JMRI, so the tests that need
  # real JMRI skip. Run the full suite (python3 tests/run.py) before merging.
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: repo
            dir: .
            apt: mosquitto mosquitto-clients
            run: python -m unittest discover -s tests
          - suite: car-cards
            dir: plugins/car-cards
            apt: tesseract-ocr
            pip: -r requirements.txt
            run: python -m unittest discover -s tests
          - suite: schematic-maps 1/3
            dir: plugins/schematic-maps
            run: SHARD=1/3 PYTHON=python bash tests/run_shards.sh
          - suite: schematic-maps 2/3
            dir: plugins/schematic-maps
            run: SHARD=2/3 PYTHON=python bash tests/run_shards.sh
          - suite: schematic-maps 3/3
            dir: plugins/schematic-maps
            run: SHARD=3/3 PYTHON=python bash tests/run_shards.sh
          - suite: operations-pro
            dir: plugins/operations-pro
            run: python tests/run.py fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: matrix.apt
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ${{ matrix.apt }}
      - if: matrix.pip
        working-directory: ${{ matrix.dir }}
        run: pip install ${{ matrix.pip }}
      - working-directory: ${{ matrix.dir }}
        run: ${{ matrix.run }}
